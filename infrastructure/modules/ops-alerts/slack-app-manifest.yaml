display_information:
  name: Deployments.ai Ops Alerts
  description: Posts CloudWatch alarm state changes from a Deployments.ai platform installation.
  background_color: "#1d1c1d"
features:
  bot_user:
    display_name: ops-alerts
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
