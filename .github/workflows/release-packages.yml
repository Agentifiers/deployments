name: Release client packages

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: Registry distribution tag
        required: true
        default: next
        type: choice
        options:
          - next
          - latest

permissions: {}

jobs:
  publish:
    name: Build, verify, and publish
    if: github.repository == 'Agentifiers/deployments' && github.ref == 'refs/heads/main'
    # GitHub-hosted, unlike CI: npm trusted publishing does not accept self-hosted runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      actions: read # Reads the CI runs of the release commit.
      contents: read
      id-token: write # npm trusted publishing and provenance.
    concurrency:
      group: release-client-packages
      cancel-in-progress: false
    steps:
      - name: Require a successful CI run on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          passed="$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=${RELEASE_COMMIT}&status=success&per_page=1" --jq '.total_count')"
          if [[ "${passed}" == "0" ]]; then
            echo "::error::CI has not passed on ${RELEASE_COMMIT}. Wait for the CI run on main to succeed, then dispatch the release again."
            exit 1
          fi

      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          package-cache: "off"

      - name: Build staged packages
        run: bun run packages:build

      - name: Verify staged package tarballs
        run: bun run packages:verify

      # `bun run` puts the lockfile-pinned npm (root devDependency) first on PATH; trusted
      # publishing of dist-tag changes needs npm 11.21.0 or later.
      - name: Publish SDK and CLI
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: bun run packages:publish -- "$DIST_TAG"
