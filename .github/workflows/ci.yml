name: CI

on:
  push:
    branches:
      - main

# Pushes to main always finish: the release workflow requires a successful CI run on its commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  format-lint:
    name: Format and lint
    runs-on: [self-hosted, srv]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: [self-hosted, srv]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          package-cache: write
      - name: Typecheck
        run: bun run typecheck

  test:
    name: Test (${{ matrix.part }})
    runs-on: [self-hosted, srv]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The parts of scripts/run-tests.ts, one runner each.
        part: [functions/worker, apps, packages, rest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Also the Node the document extraction tests spawn: Lambda runs the same major (nodejs26.x).
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
      - name: Test
        env:
          PART: ${{ matrix.part }}
        run: bun run test -- --part "$PART"

  test-postgres:
    name: Test (Postgres)
    runs-on: [self-hosted, srv]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
      - name: Run the app database Postgres lane
        env:
          APPS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: bun run test:postgres

  contract:
    name: Contracts
    runs-on: [self-hosted, srv]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
      - name: Check the BYOC contract
        run: bun run contract:check
      - name: Run the end-to-end contract suite
        run: bun run e2e:contract

  infrastructure:
    name: Infrastructure
    runs-on: [self-hosted, srv]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
      # Every root and module shares one provider copy per version, keyed by the lock files.
      - name: Restore the OpenTofu provider cache
        id: provider-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tofu-provider-cache
          key: tofu-${{ hashFiles('.opentofu-version') }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('infrastructure/**/.terraform.lock.hcl') }}
      - name: Validate infrastructure
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tofu-provider-cache
        run: bun run infrastructure:validate
      - name: Save the OpenTofu provider cache
        if: >-
          steps.provider-cache.outputs.cache-hit != 'true'
          && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tofu-provider-cache
          key: ${{ steps.provider-cache.outputs.cache-primary-key }}

  build:
    name: Build
    runs-on: [self-hosted, srv]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
      - name: Build
        run: bun run build
      - name: Require the build to leave tracked files unchanged
        run: git diff --exit-code --stat

  provider:
    name: OpenTofu provider
    runs-on: [self-hosted, srv]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infrastructure/terraform-provider-deployments
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: infrastructure/terraform-provider-deployments/go.mod
          cache-dependency-path: infrastructure/terraform-provider-deployments/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  workflows:
    name: Workflow lint
    runs-on: [self-hosted, srv]
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false

  authorship:
    name: Commit authorship
    runs-on: [self-hosted, srv]
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require noreply identities
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          noreply_pattern='^[0-9]+\+[^@]+@users\.noreply\.github\.com$'
          failed=0

          # Branch creation and force pushes can leave no usable old tip, so audit all history.
          if [[ "${BEFORE}" =~ ^0{40}$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="HEAD"
          else
            range="${BEFORE}..HEAD"
          fi

          while IFS= read -r sha; do
            short_sha="$(git rev-parse --short "${sha}")"
            author_email="$(git log -1 --format='%ae' "${sha}")"
            committer_email="$(git log -1 --format='%ce' "${sha}")"

            if ! [[ "${author_email}" =~ ${noreply_pattern} ]]; then
              printf '::error::%s author email %s is not a GitHub noreply address\n' "${short_sha}" "${author_email}"
              failed=1
            fi
            if [[ "${committer_email}" != "noreply@github.com" ]] && ! [[ "${committer_email}" =~ ${noreply_pattern} ]]; then
              printf '::error::%s committer email %s is not a GitHub noreply address\n' "${short_sha}" "${committer_email}"
              failed=1
            fi

            coauthored="$(git log -1 --format='%(trailers:key=Co-authored-by,valueonly)' "${sha}")"
            while IFS= read -r trailer; do
              if [[ -z "${trailer}" ]]; then
                continue
              fi
              email=""
              if [[ "${trailer}" =~ \<([^>]*)\> ]]; then
                email="${BASH_REMATCH[1]}"
              fi
              if ! [[ "${email}" =~ ${noreply_pattern} ]]; then
                printf '::error::%s has non-noreply Co-authored-by trailer %s\n' "${short_sha}" "${trailer}"
                failed=1
              fi
            done <<< "${coauthored}"
          done < <(git rev-list "${range}")

          if [[ "${failed}" -ne 0 ]]; then
            exit 1
          fi
          printf 'Commit authorship checks passed.\n'

  ci-ok:
    name: CI passed
    if: always()
    needs:
      - format-lint
      - typecheck
      - test
      - test-postgres
      - contract
      - infrastructure
      - build
      - provider
      - workflows
      - authorship
    runs-on: [self-hosted, srv]
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" ]]; then
              echo "::error::A required CI job finished with ${result}."
              exit 1
            fi
          done
