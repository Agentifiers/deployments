name: Set up workspace
description: >-
  Install the repository's pinned Bun and Node toolchain and the workspace dependencies from the
  frozen lockfile. Callers check out the repository first.
inputs:
  package-cache:
    description: >-
      Bun's package cache, keyed by the lockfile: `read` restores it, `write` also saves it on a
      push to main when the lockfile's entry is missing (one job per workflow, so concurrent jobs do
      not race to save the same key), `off` neither (publishing workflows).
    required: false
    default: read
runs:
  using: composite
  steps:
    - name: Check the package cache mode
      shell: bash
      env:
        PACKAGE_CACHE: ${{ inputs.package-cache }}
      run: |
        case "${PACKAGE_CACHE}" in
          read | write | off) ;;
          *) echo "package-cache must be read, write, or off, not ${PACKAGE_CACHE}." >&2; exit 1 ;;
        esac
    - name: Set up Bun
      id: bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
        no-cache: true
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        package-manager-cache: false
    - name: Restore the Bun package cache
      id: package-cache
      if: inputs.package-cache != 'off'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/bun-package-cache
        key: bun-${{ steps.bun.outputs.bun-version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
    - name: Install dependencies
      shell: bash
      env:
        # Same filesystem as the checkout, so Bun hardlinks packages out of the cache.
        BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-package-cache
      run: bun install --frozen-lockfile
    # Only main writes, so a pull request can never seed what main restores.
    - name: Save the Bun package cache
      if: >-
        inputs.package-cache == 'write' && steps.package-cache.outputs.cache-hit != 'true'
        && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/bun-package-cache
        key: ${{ steps.package-cache.outputs.cache-primary-key }}
